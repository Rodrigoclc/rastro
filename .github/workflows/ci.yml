name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    name: Biblioteca (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  server:
    name: Configuração do servidor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida o Collector
        run: >-
          docker run --rm -e OTEL_TOKEN_PRODUCTION=x -e OTEL_TOKEN_STAGING=y
          -v "$PWD/server/collector/config.yaml:/c.yaml:ro"
          otel/opentelemetry-collector-contrib:0.165.0 validate --config=/c.yaml
      - name: Valida o compose
        working-directory: server
        run: cp .env.example .env && sed -i 's/=$/=x/' .env && docker compose config -q
      - name: Dashboards gerados estão atualizados
        working-directory: server
        run: python3 scripts/build-dashboards.py && git diff --exit-code grafana/dashboards
