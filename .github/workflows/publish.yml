name: Publicar no npm

# Crie a tag v<versão> (ex.: v0.2.0) igual à versão de packages/rastro/package.json.
#
# Sem token: o npm confia neste workflow por trusted publishing (OIDC). A configuração
# fica no npmjs.com, em @rodrigoclc/rastro > Settings > Trusted Publisher (Rodrigoclc/rastro, publish.yml).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC do trusted publishing e proveniência do pacote

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      # Node 24: o trusted publishing exige npm 11.5.1+ e Node 22.14+.
      # A biblioteca continua suportando Node 20 em execução (ver ci.yml).
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # sem cache em build de release
      - run: pnpm install --frozen-lockfile
      - name: Tag confere com a versão
        working-directory: packages/rastro
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm test
      - working-directory: packages/rastro
        run: npm publish
