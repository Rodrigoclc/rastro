# Regras de alerta das APIs. Só avaliam produção: homologação não acorda ninguém.
#
# O destino das notificações (Slack, Discord, e-mail) é o "contact point" da
# política padrão, configurado uma vez na tela: Alerting > Contact points.
apiVersion: 1

groups:
  - orgId: 1
    name: APIs (produção)
    folder: Rastro
    interval: 1m
    rules:
      - uid: rastro-api-erro-5xx
        title: Taxa de erro 5xx alta
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service_name }} com {{ humanizePercentage $values.A.Value }} de erros 5xx"
          description: "Mais de 5% das requisições em produção falharam com 5xx nos últimos 5 minutos."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              range: false
              # Exige um mínimo de tráfego (3 req/min) para não alertar por uma requisição isolada.
              expr: >-
                (
                  sum by (service_name) (rate(http_server_request_duration_seconds_count{deployment_environment_name="production", http_response_status_code=~"5.."}[5m]))
                  /
                  sum by (service_name) (rate(http_server_request_duration_seconds_count{deployment_environment_name="production"}[5m]))
                )
                and
                sum by (service_name) (rate(http_server_request_duration_seconds_count{deployment_environment_name="production"}[5m])) > 0.05
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: rastro-api-latencia-p95
        title: Latência p95 alta
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.service_name }} com p95 de {{ humanizeDuration $values.A.Value }}"
          description: "O p95 de latência das requisições em produção está acima de 2s há 10 minutos."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              instant: true
              range: false
              expr: >-
                histogram_quantile(0.95, sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket{deployment_environment_name="production"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [2] }

      - uid: rastro-api-sem-dados
        title: Serviço parou de enviar dados
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.service_name }} não envia telemetria há 10 minutos"
          description: "O serviço enviou dados nas últimas 6 horas mas nada nos últimos 10 minutos. A aplicação pode estar fora do ar."
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 21600, to: 0 }
            model:
              refId: A
              instant: true
              range: false
              # A métrica de event loop é enviada por toda app com métricas ligadas, com ou sem tráfego.
              expr: >-
                group by (service_name) (max_over_time(nodejs_eventloop_utilization_ratio{deployment_environment_name="production"}[6h]))
                unless
                group by (service_name) (max_over_time(nodejs_eventloop_utilization_ratio{deployment_environment_name="production"}[10m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
